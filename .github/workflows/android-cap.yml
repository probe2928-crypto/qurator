name: Android app (Capacitor, unsigned AAB)
# 플레이스토어 앱을 TWA(크롬에 기대는 방식) 대신 아이폰 앱과 같은 Capacitor 웹뷰 앱으로 만든다.
# 일부 폰(태국 테스터 등)에서 TWA가 '열기'를 눌러도 바로 꺼지던 문제 → 크롬·도메인 인증 없이 앱 안에서 바로 열리게.
# 서명 안 된 AAB만 만든다. 서명은 업로드 키로 따로 한다(키는 이 공개 저장소에 절대 넣지 않음).
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Play versionCode (이전 업로드보다 커야 함)"
        required: true
        default: "4"
permissions:
  contents: write
concurrency:
  group: android-cap
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 앱 화면(www) + 안드로이드 프로젝트
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save @capacitor/android@^8.0.0
          node build-www.mjs
          npx cap add android
          npm run assets -- --android || true
          V="$(node -p "require('./package.json').version")"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 26/" android/variables.gradle   # QR 스캐너 라이브러리가 Android 8.0(26) 이상 필요
          grep -nE "applicationId|versionCode|versionName|minSdk|targetSdk" android/app/build.gradle android/variables.gradle || true
          npx cap sync android
      - name: 출시용 AAB (서명 전)
        working-directory: app/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew && ./gradlew bundleRelease --no-daemon -q
          ls -la app/build/outputs/bundle/release/
      - name: android-build 브랜치에 올리기
        run: |
          V=$(node -p "require('./app/package.json').version"); C=${{ github.event.inputs.versionCode }}
          mkdir -p /tmp/out
          cp app/android/app/build/outputs/bundle/release/app-release.aab /tmp/out/qurator-$V-$C-cap-unsigned.aab
          git config user.name "qurator-bot"; git config user.email "qurator-bot@users.noreply.github.com"
          git fetch origin android-build && git checkout android-build
          cp /tmp/out/* . && git add -A && git commit -qm "Android Capacitor build $V ($C)"
          for i in 1 2 3 4; do git pull -q --rebase origin android-build && git push -q origin android-build && break; sleep 8; done
