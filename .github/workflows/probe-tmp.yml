name: tmp probe commons
on: { push: { branches: [tmp-probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA={'User-Agent':'QURATOR/1.0 (https://probe2928-crypto.github.io/qurator/)'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
          out={}
          for lang,t in [('ko','설송도'),('ko','이인상'),('en','Yi Insang')]:
              u=f'https://{lang}.wikipedia.org/w/api.php?action=query&format=json&prop=images|pageimages&piprop=original&imlimit=50&redirects=1&titles='+urllib.parse.quote(t)
              try: out[lang+':'+t]=json.loads(get(u))
              except Exception as e: out[lang+':'+t]=str(e)
          # 국립중앙박물관 소장품 검색 결과도 확인
          try: out['emuseum']=get('https://www.emuseum.go.kr/openapi/relic/list?serviceKey=x&name='+urllib.parse.quote('설송도'))[:3000].decode('utf-8','ignore')
          except Exception as e: out['emuseum']=str(e)
          json.dump(out,open('probe/result.json','w'),ensure_ascii=False,indent=1)
          PY
          git config user.name bot; git config user.email b@x; git add probe; git commit -qm probe; git push -q origin HEAD:tmp-probe-out -f
