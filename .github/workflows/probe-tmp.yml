name: tmp probe commons
on: { push: { branches: [tmp-probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re
          UA={'User-Agent':'Mozilla/5.0 QURATOR'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
          out={}
          for u in ['https://www.emuseum.go.kr/search?keyword='+urllib.parse.quote('설송도'),
                    'https://www.museum.go.kr/site/main/relic/search/list?keyword='+urllib.parse.quote('설송도'),
                    'https://www.museum.go.kr/site/main/relic/search/list?relicNm='+urllib.parse.quote('설송도')]:
              try:
                  h=get(u).decode('utf-8','ignore')
                  out[u]={'len':len(h),'links':sorted(set(re.findall(r'(?:href|src)=["\']([^"\']*(?:detail|relicId|img|image)[^"\']*)',h)))[:80],'snip':[h[m.start()-300:m.start()+300] for m in re.finditer('설송',h)][:5]}
              except Exception as e: out[u]=str(e)
          json.dump(out,open('probe/result.json','w'),ensure_ascii=False,indent=1)
          PY
          git config user.name bot; git config user.email b@x; git add probe; git commit -qm probe; git push -q origin HEAD:tmp-probe-out -f
