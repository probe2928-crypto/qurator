name: Voice audition (temporary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/voice-audition.yml", "scripts/voice_audition.py"]
permissions:
  contents: write
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Supertonic 3 (code + archived model, pinned)
        run: |
          git clone -q https://github.com/supertone-oss-archive/supertonic.git /tmp/supertonic
          git -C /tmp/supertonic checkout -q 1e9799e964ea4c0dad7cde993b65c3c813a7b373
          pip install --quiet "onnxruntime==1.23.1" numpy soundfile huggingface_hub faster-whisper
          hf download supertone-oss-archive/supertonic-3 --revision aafc6e32416a594460b32413efc49d7fe4ce6d46 --local-dir /tmp/supertonic/assets
          ls /tmp/supertonic/assets /tmp/supertonic/assets/voice_styles
      - name: Audition
        run: python scripts/voice_audition.py
      - name: Commit samples
        run: |
          git config user.name "qurator-bot"; git config user.email "qurator-bot@users.noreply.github.com"
          git add audio/_audition
          git commit -m "Voice audition: Supertonic 3 Korean presets" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
