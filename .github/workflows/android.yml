name: Android app (Google Play, unsigned AAB)
# Builds an UNSIGNED release bundle. Signing happens offline with the upload key, which never enters this public repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "scripts/android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate TWA project (Bubblewrap)
        run: |
          npm install --no-save --silent @bubblewrap/core@1.27.0
          node scripts/android/twa.mjs build/twa
      - name: Build release bundle
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd build/twa && ./gradlew bundleRelease --no-daemon -q
          ls -la app/build/outputs/bundle/release/
      - name: Publish unsigned AAB to the android-build branch
        run: |
          V=$(node -p "require('./android/twa-config.json').appVersionName")
          C=$(node -p "require('./android/twa-config.json').appVersionCode")
          mkdir -p /tmp/out && cp build/twa/app/build/outputs/bundle/release/app-release.aab /tmp/out/qurator-$V-$C-unsigned.aab
          cp build/twa/twa-manifest.json /tmp/out/
          tar --exclude='twa/app/build' --exclude='twa/.gradle' -czf /tmp/out/twa-project.tgz -C build twa
          git config user.name "qurator-bot"; git config user.email "qurator-bot@users.noreply.github.com"
          git fetch origin android-build && git checkout android-build || git checkout --orphan android-build
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name store -exec rm -rf {} +
          cp /tmp/out/* . && printf '# QURATOR Android build output\nUnsigned bundles built by CI. Sign with the upload key before uploading to Google Play.\n' > README.md
          git add -A && git commit -qm "Android build $V ($C)"
          for i in 1 2 3 4; do git pull -q --rebase origin android-build && git push -q origin android-build && break; sleep 8; done
